[project]
name = "apscrap"
version = "0.1.0"
description = "Portuguese apartment listing scraper and price-history warehouse"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.scripts]
apscrap = "apscrap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apscrap*"]

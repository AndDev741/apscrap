name: Image

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/anddev741/apscrap

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Syntax check
        run: |
          python3 -m compileall -q apscrap scripts
          node --check site/app.js

      - name: Build
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .

      - name: Smoke test the image
        run: |
          docker run --rm "$IMAGE:latest" apscrap --help >/dev/null
          docker run --rm "$IMAGE:latest" wrangler --version

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Flux image automation in be-infra watches :latest and rolls the new
      # digest into the CronJob within about five minutes.
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
